# Atualização automática de dependências (PGCS seção 13).
# Cada atualização vira um PR que passa pelo mesmo fluxo de CI.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
