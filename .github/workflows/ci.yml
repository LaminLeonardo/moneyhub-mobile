# Pipeline de Integração Contínua (CI) — PGCS seção 5
# Disparado em todo Pull Request para a main. O merge só é permitido com
# todos os jobs verdes (status checks obrigatórios na proteção da branch).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Título do PR segue Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 1. Instalar Flutter (com cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 1. Restaurar dependências
        run: |
          flutter --version
          flutter pub get

      - name: 3. Formatação de código
        run: dart format --output=none --set-exit-if-changed .

      - name: 3. Análise estática (lint)
        run: flutter analyze --no-fatal-infos

      - name: 4-5. Testes unitários, de widget e de integração
        run: flutter test --coverage

      - name: 4. Quality gate de cobertura (mínimo 70%)
        run: bash ../scripts/check_coverage.sh coverage/lcov.info 70

      - name: 2. Build web (release)
        run: flutter build web --release --dart-define=APP_VERSION=pr-${{ github.sha }}

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: mobile/coverage/lcov.info
          retention-days: 14

      - name: Publicar build web
        uses: actions/upload-artifact@v4
        with:
          name: web-build-ci
          path: mobile/build/web
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 6. Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Análise de dependências (SCA)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker-build:
    name: docker-build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar build web gerado no job build-test
        uses: actions/download-artifact@v4
        with:
          name: web-build-ci
          path: mobile/build/web

      - uses: docker/setup-buildx-action@v3

      - name: 7. Empacotar imagem (sem publicar em PR)
        uses: docker/build-push-action@v6
        with:
          context: mobile
          push: false
          tags: moneyhub-mobile:pr-${{ github.sha }}
