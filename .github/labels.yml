# Situação da Solicitação de Mudança (SM) / defeito — ciclo de vida
- name: "status:nova"
  color: "ededed"
  description: "SM registrada, aguardando análise"
- name: "status:atribuida"
  color: "c5def5"
  description: "SM analisada e atribuída a um responsável"
- name: "status:em-andamento"
  color: "0e8a16"
  description: "Branch de feature/hotfix aberta"
- name: "status:finalizada"
  color: "5319e7"
  description: "PR integrado na main (CI verde)"
- name: "status:verificada"
  color: "1d76db"
  description: "Validada em Homologação"
- name: "status:fechada"
  color: "000000"
  description: "Entregue em Produção (release publicada)"
- name: "status:rejeitada"
  color: "b60205"
  description: "SM rejeitada (custo maior que benefício ou fora do escopo)"

