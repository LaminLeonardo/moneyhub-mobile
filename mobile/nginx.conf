server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida devolve o index.html do Flutter
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nunca cachear o index e o version.json (permite verificar a versão publicada)
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-store";
    }
}
